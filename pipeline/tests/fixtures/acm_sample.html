<!-- Trimmed sample of the ACM "Find a Children's Museum" directory markup.
     data-reciprocal="true" mirrors the red "R" reciprocal flag. -->
<ul class="museum-list">
  <li class="museum" data-reciprocal="true">
    <a class="name" href="https://www.pleasetouchmuseum.org">Please Touch Museum</a>
    <span class="city">Philadelphia</span>
    <span class="state">PA</span>
  </li>
  <li class="museum" data-reciprocal="false">
    <a class="name" href="https://example.org/not-reciprocal">Non-Reciprocal Kids Museum</a>
    <span class="city">Nowhere</span>
    <span class="state">TX</span>
  </li>
  <li class="museum" data-reciprocal="true">
    <a class="name" href="https://www.kohlchildrensmuseum.org">Kohl Children's Museum</a>
    <span class="city">Glenview</span>
    <span class="state">IL</span>
  </li>
</ul>
