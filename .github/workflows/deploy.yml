name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [ main ]
  # The data refresh pushes with GITHUB_TOKEN, which never triggers `push`
  # workflows — so redeploy when it finishes instead.
  workflow_run:
    workflows: [ "Update reciprocal data" ]
    types: [ completed ]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-deploy:
    # Skip when the data refresh failed (e.g. its count guardrail tripped).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site (app + data only)
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
