name: Update reciprocal data
on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}    # manual trigger
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Test the adapters (a broken parser fails here, before any data is written)
        run: python -m pytest pipeline/tests -q
      # AZA and Time Travelers opt out of scraping: they're read from
      # pipeline/manual_drops/<program>/ when a file is there, else skipped.
      - name: Build data/museums.json from live sources + manual drops
        run: python pipeline/build.py --sources astc,acm,narm,roam,ahs,aza,timetravelers
      - name: Commit refreshed data (if changed)
        run: |
          git config user.name  "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/museums.json data/meta.json
          # The geocode cache only exists once at least one lookup has succeeded.
          [ -f pipeline/geocode_cache.json ] && git add pipeline/geocode_cache.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): monthly refresh"
            git push
          fi
      # build.py exits non-zero if a source's count collapses (guardrail),
      # which fails the job and leaves the last good data in place.
